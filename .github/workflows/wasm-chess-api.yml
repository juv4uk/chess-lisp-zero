name: WASM Chess API

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/chess.my'
      - 'lib/fen.wsm'
      - 'lib/wasm-api.wsm'
      - 'lib/neural-contract.wsm'
      - 'lib/puct.wsm'
      - 'lib/self-play.wsm'
      - 'tests/neural-contract.wsm'
      - 'tests/puct.wsm'
      - 'tests/self-play.wsm'
      - 'training/**'
      - 'tests/test_from_zero_torch.py'
      - 'docs/NEURAL-NETWORK-ROADMAP.md'
      - 'src/chess-api.mjs'
      - 'tools/wasm-chess-smoke.mjs'
      - '.github/workflows/wasm-chess-api.yml'

jobs:
  native-wasm-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout canonical my-lisp
        uses: actions/checkout@v4
        with:
          repository: juv4uk/my-lisp
          path: my-lisp

      - name: Install Rust with WASM target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0

      - name: Build canonical native interpreter
        run: cargo build --release --manifest-path my-lisp/Cargo.toml -p my-lisp-cli

      - name: Run native chess API fixture
        run: my-lisp/target/release/my-lisp tests/wasm-api.wsm

      - name: Run neural input and policy contract
        run: my-lisp/target/release/my-lisp tests/neural-contract.wsm

      - name: Run deterministic PUCT reference
        run: my-lisp/target/release/my-lisp tests/puct.wsm

      - name: Run from-zero self-play record contract
        run: my-lisp/target/release/my-lisp tests/self-play.wsm

      - name: Run bounded from-zero PyTorch checkpoint smoke
        run: |
          python3 -m pip install --disable-pip-version-check torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          PYTHONPATH=. python3 tests/test_from_zero_torch.py

      - name: Build canonical WASM adapter
        run: wasm-pack build my-lisp/crates/my-lisp-wasm --target nodejs --out-dir "$GITHUB_WORKSPACE/wasm-pkg"

      - name: Run the same chess sources through real WASM
        run: node tools/wasm-chess-smoke.mjs wasm-pkg

      - name: Build browser play-slice assets
        env:
          MY_LISP_DIR: ${{ github.workspace }}/my-lisp
        run: bash scripts/build-wasm.sh

      - name: Validate browser modules
        run: |
          node --check src/chess-api.mjs
          node --check src/app.mjs
          test -f src/generated/wasm/my_lisp_wasm.js
          test -f src/generated/wasm/my_lisp_wasm_bg.wasm
          test -f src/generated/lisp/chess.my
