<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>chess-lisp-zero</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1rem;
      min-height: 100vh;
      gap: 1rem;
    }
    h1 {
      font-size: 1.2rem;
      color: #a0a0c0;
    }
    .board {
      display: grid;
      grid-template-columns: repeat(8, 48px);
      grid-template-rows: repeat(8, 48px);
      border: 2px solid #404060;
    }
    .cell {
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      cursor: pointer;
    }
    .light { background: #b58863; }
    .dark { background: #f0d9b5; }
    .repl {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .repl label {
      font-size: 0.8rem;
      color: #707090;
    }
    .repl textarea {
      background: #222233;
      color: #e0e0e0;
      border: 1px solid #404060;
      border-radius: 4px;
      padding: 0.5rem;
      font-family: monospace;
      font-size: 0.9rem;
      resize: vertical;
      min-height: 60px;
    }
    .repl button {
      background: #3a3a5c;
      color: #e0e0e0;
      border: none;
      border-radius: 4px;
      padding: 0.5rem 1rem;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .repl button:hover { background: #4a4a6c; }
    .result {
      background: #222233;
      border: 1px solid #404060;
      border-radius: 4px;
      padding: 0.5rem;
      font-family: monospace;
      font-size: 0.85rem;
      min-height: 2rem;
      color: #a0d0a0;
    }
    .result.error { color: #d0a0a0; }
    .status {
      font-size: 0.8rem;
      color: #505070;
    }
  </style>
</head>
<body>
  <h1>chess-lisp-zero</h1>
  <div class="board" id="board"></div>

  <div class="repl">
    <label>my-lisp</label>
    <textarea id="code" placeholder="(+ 1 2 3)">(+ 1 2 3)</textarea>
    <button onclick="evalCode()">Eval</button>
    <div class="result" id="result">—</div>
  </div>

  <div class="status" id="status">Tauri shell MVP — my-lisp embedded</div>

  <script>
    const PIECES = {
      'r': '\u265C', 'n': '\u265E', 'b': '\u265D', 'q': '\u265B',
      'k': '\u265A', 'p': '\u265F',
      'R': '\u2656', 'N': '\u2658', 'B': '\u2657', 'Q': '\u2655',
      'K': '\u2654', 'P': '\u2659'
    };
    const START_FEN = 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR';

    function renderBoard(fen) {
      const board = document.getElementById('board');
      board.innerHTML = '';
      const rows = fen.split('/');
      for (let r = 0; r < 8; r++) {
        let col = 0;
        for (const ch of rows[r]) {
          if (ch >= '1' && ch <= '8') {
            for (let i = 0; i < parseInt(ch); i++) {
              addCell(board, r, col, null);
              col++;
            }
          } else {
            addCell(board, r, col, ch);
            col++;
          }
        }
      }
    }

    function addCell(board, row, col, piece) {
      const cell = document.createElement('div');
      cell.className = 'cell ' + ((row + col) % 2 === 0 ? 'light' : 'dark');
      if (piece) cell.textContent = PIECES[piece] || '';
      board.appendChild(cell);
    }

    renderBoard(START_FEN);

    async function evalCode() {
      const code = document.getElementById('code').value;
      const resultEl = document.getElementById('result');
      resultEl.textContent = '…';
      resultEl.className = 'result';
      try {
        const result = await window.__TAURI__.core.invoke('eval_my_lisp', { source: code });
        resultEl.textContent = result;
      } catch (error) {
        resultEl.textContent = 'Error: ' + error;
        resultEl.className = 'result error';
      }
    }
  </script>
</body>
</html>
