<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>chess-lisp-zero</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { min-height: 100vh; padding: 1rem; display: flex; flex-direction: column; align-items: center; gap: 1rem; color: #e8e8ef; background: #171725; font-family: system-ui, sans-serif; }
    h1 { font-size: 1.25rem; color: #b8b8d8; }
    .board { display: grid; grid-template-columns: repeat(8, min(11vw, 58px)); grid-template-rows: repeat(8, min(11vw, 58px)); border: 3px solid #494968; box-shadow: 0 12px 32px #090910aa; }
    .cell { position: relative; display: flex; align-items: center; justify-content: center; border: 0; font-size: min(7vw, 2.1rem); cursor: pointer; }
    .light { background: #e4c79e; }
    .dark { background: #876448; }
    .cell.selected { outline: 4px solid #ffe06a; outline-offset: -4px; }
    .cell.target::after { content: ""; position: absolute; width: 28%; height: 28%; border-radius: 50%; background: #2abf73bb; }
    .cell.target:not(:empty)::after { width: 78%; height: 78%; border: 4px solid #2abf73cc; background: transparent; }
    .controls { display: flex; gap: .75rem; align-items: center; }
    button { padding: .55rem .9rem; border: 1px solid #55557b; border-radius: 5px; color: #eee; background: #343450; cursor: pointer; }
    button:hover { background: #444466; }
    .status { max-width: 520px; color: #aaaac8; text-align: center; }
    .status.error { color: #ef9f9f; }
    .fen { max-width: 95vw; overflow-wrap: anywhere; color: #8d8daa; font: .75rem ui-monospace, monospace; }
  </style>
</head>
<body>
  <h1>chess-lisp-zero</h1>
  <div class="board" id="board" aria-label="Шахова дошка"></div>
  <div class="controls"><button id="reset" type="button">Нова партія</button><span id="turn">—</span></div>
  <div class="status" id="status">Завантаження my-lisp WASM…</div>
  <div class="fen" id="fen"></div>
  <script type="module" src="./app.mjs"></script>
</body>
</html>
