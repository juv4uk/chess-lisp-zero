[package]
name = "chess-lisp-zero"
version = "0.1.0"
description = "Chess engine on my-lisp with Tauri shell"
authors = ["chess-lisp-zero contributors"]
edition = "2021"

[lib]
name = "chess_lisp_zero_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
